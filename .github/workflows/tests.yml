name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# Un push nuevo a un PR cancela el run anterior del mismo PR, que ya es
# obsoleto. En `main` NO se cancela: cada commit de la rama principal debe
# quedar con su propio run concluido.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ─── Calidad estática: formato, lint, tipos y build ──────────────────────
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Use Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: 20.x
          cache: "npm"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Prettier check
        run: npm run format:check

      - name: Build (packages + services)
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

  # ─── Tests unitarios y de integración con cobertura ──────────────────────
  test:
    runs-on: ubuntu-latest
    env:
      TZ: America/Bogota

    strategy:
      matrix:
        node-version: [20.x]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_test
          POSTGRES_DB: postgres
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      rabbitmq:
        image: rabbitmq:3-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: beautyspot_test
          RABBITMQ_DEFAULT_PASS: test123
        ports:
          - 5673:5672
          - 15673:15672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build shared packages
        run: npm run build --workspace packages/shared-types --workspace packages/shared-utils --workspace packages/event-types --workspace packages/shared-constants --workspace packages/database --workspace packages/nest-common

      - name: Create test databases
        run: PGPASSWORD=postgres_test psql -h localhost -p 5434 -U postgres -f infra/docker/postgres/init-test.sql

      - name: Run tests (unit)
        run: npm run test:coverage

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info,./packages/*/coverage/lcov.info,./services/*/coverage/lcov.info
          fail_ci_if_error: false

  # ─── Tests de integración contra infraestructura real ─────────────────────
  #
  # Los *.int-test.ts corren contra Postgres/Redis/RabbitMQ de verdad, no contra
  # mocks. Se levanta la infraestructura con el propio docker-compose.test.yml
  # en vez de con bloques `services:` para no duplicar puertos y credenciales:
  # los .env.test de cada servicio ya apuntan a ese compose.
  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Use Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: 20.x
          cache: "npm"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      # Imprescindible: ts-jest type-checa los *.int-test.ts, y aunque el
      # moduleNameMapper resuelve @beautyspot/* a los fuentes en ejecución, los
      # TIPOS se resuelven por node_modules -> dist/index.d.ts. Sin este paso,
      # cualquier test que importe de un paquete compartido falla con TS2307.
      - name: Build shared packages
        run: npm run build --workspace packages/shared-types --workspace packages/shared-utils --workspace packages/event-types --workspace packages/shared-constants --workspace packages/database --workspace packages/nest-common

      # --wait bloquea hasta que los tres healthchecks pasan a healthy.
      - name: Levantar infraestructura de test
        run: docker compose -f docker-compose.test.yml up -d --wait

      - name: Tests de integración de los 8 servicios
        run: |
          set -euo pipefail
          for servicio in api-gateway auth-service core-service booking-service \
            payment-service notification-service marketplace-service \
            analytics-service; do
            echo "::group::$servicio"
            npm run test:int --workspace "@beautyspot/$servicio"
            echo "::endgroup::"
          done

      - name: Logs de la infraestructura
        if: failure()
        run: docker compose -f docker-compose.test.yml logs --tail 50

      - name: Parar infraestructura
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  # ─── Qué imágenes hay que construir según los ficheros cambiados ──────────
  #
  # Construir las 9 imágenes en cada run cuesta ~31 de los ~38 minutos
  # facturables del workflow. Un cambio típico toca uno o dos servicios, así que
  # aquí se calcula la matriz mínima. Se hace con `git diff` en vez de una
  # action de terceros para no añadir dependencias al pipeline.
  changes:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.detect.outputs.images }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          # Historial completo: hace falta para diferenciar contra la base.
          fetch-depth: 0

      - name: Detectar imágenes afectadas
        id: detect
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail

          # nombre-de-imagen:directorio. El Dockerfile es <directorio>/Dockerfile.
          IMAGES=(
            "api-gateway:services/api-gateway"
            "auth-service:services/auth-service"
            "core-service:services/core-service"
            "booking-service:services/booking-service"
            "payment-service:services/payment-service"
            "notification-service:services/notification-service"
            "marketplace-service:services/marketplace-service"
            "analytics-service:services/analytics-service"
            "frontend:apps/frontend"
          )

          # Cambios que afectan a TODAS las imágenes: los builds parten de la
          # raíz del monorepo (npm install + turbo), así que el lockfile, los
          # paquetes compartidos y el tooling invalidan cualquier imagen.
          SHARED='^(package\.json|package-lock\.json|turbo\.json|tsconfig\.base\.json|\.dockerignore|packages/|\.github/workflows/)'

          seleccion=()
          if [ "$EVENT" = "workflow_dispatch" ] || [ -z "${BASE_SHA:-}" ] ||
             [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            # Ejecución manual o rama nueva: sin base fiable, se construye todo.
            echo "Sin base de comparación (evento: $EVENT): se construyen todas."
            for entry in "${IMAGES[@]}"; do seleccion+=("${entry%%:*}"); done
          else
            cambiados=$(git diff --name-only "$BASE_SHA" HEAD)
            echo "Ficheros cambiados:"
            echo "$cambiados" | sed 's/^/  /'

            if echo "$cambiados" | grep -qE "$SHARED"; then
              echo "Cambió código o configuración compartida: se construyen todas."
              for entry in "${IMAGES[@]}"; do seleccion+=("${entry%%:*}"); done
            else
              for entry in "${IMAGES[@]}"; do
                if echo "$cambiados" | grep -qE "^${entry#*:}/"; then
                  seleccion+=("${entry%%:*}")
                fi
              done
            fi
          fi

          # JSON a mano: los nombres y rutas son literales de este workflow, no
          # hay nada que escapar, y así el script no depende de jq.
          entradas=""
          for entry in "${IMAGES[@]}"; do
            nombre=${entry%%:*}
            for elegido in ${seleccion[@]+"${seleccion[@]}"}; do
              if [ "$elegido" = "$nombre" ]; then
                [ -n "$entradas" ] && entradas="$entradas,"
                entradas="$entradas{\"name\":\"$nombre\",\"file\":\"${entry#*:}/Dockerfile\"}"
              fi
            done
          done
          matriz="[$entradas]"

          echo "Matriz de build: $matriz"
          echo "images=$matriz" >>"$GITHUB_OUTPUT"

  # ─── Build de imágenes Docker (valida que cada Dockerfile construye) ──────
  docker-build:
    runs-on: ubuntu-latest
    needs: [quality, changes]
    # Ningún Dockerfile ni código de servicio tocado: nada que construir.
    if: needs.changes.outputs.images != '[]'
    strategy:
      # En cuanto una imagen falla se cancelan las demás: el fallo casi siempre
      # es del build compartido (lockfile, packages/*) y afectaría a todas, así
      # que seguir construyendo las otras 8 solo gasta minutos.
      fail-fast: true
      matrix:
        image: ${{ fromJSON(needs.changes.outputs.images) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build ${{ matrix.image.name }} image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.image.file }}
          push: false
          tags: beautyspot-${{ matrix.image.name }}:ci
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}

  # ─── Check agregado ───────────────────────────────────────────────────────
  #
  # ESTE es el único job que debe marcarse como required check en la protección
  # de `main`. Los nombres de los jobs de docker-build dependen de la matriz
  # dinámica y el job entero se omite cuando no hay imágenes que construir, así
  # que exigirlos por nombre dejaría el check ausente y bloquearía el merge.
  # Aquí un job omitido cuenta como correcto; solo fallan los fallos reales.
  ci:
    runs-on: ubuntu-latest
    needs: [quality, test, integration, changes, docker-build]
    if: always()
    steps:
      - name: Verificar el resultado de los jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys

          jobs = json.loads(os.environ["NEEDS"])
          for nombre, datos in sorted(jobs.items()):
              print(f"  {nombre}: {datos['result']}")

          malos = sorted(
              n for n, d in jobs.items() if d["result"] in ("failure", "cancelled")
          )
          if malos:
              print(f"::error::Jobs fallidos o cancelados: {', '.join(malos)}")
              sys.exit(1)

          print("Todos los jobs han pasado (los omitidos no cuentan como fallo).")
          PY
